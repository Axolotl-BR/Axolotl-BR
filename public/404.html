<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050507" />
    <title>404 — você saiu do mapa · Axolotl BR</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050507;
        background-image:
          radial-gradient(600px 300px at 50% 30%, rgba(139, 59, 255, 0.16), transparent 70%);
        color: #f4f1fb;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #8b3bff;
        margin-bottom: 18px;
      }
      h1 { font-size: 3rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px; }
      p { color: #a8a0c2; margin-bottom: 28px; max-width: 420px; line-height: 1.6; }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: white;
        background: linear-gradient(135deg, #8b3bff, #a45dff);
        padding: 14px 28px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.05em;
        transition: transform 0.16s ease, box-shadow 0.16s ease;
      }
      a:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(139, 59, 255, 0.4); }
      a:focus-visible { outline: 2px solid #f4f1fb; outline-offset: 3px; }
      .ax { font-size: 40px; margin-bottom: 8px; filter: drop-shadow(0 0 24px rgba(139, 59, 255, 0.5)); }
    </style>
  </head>
  <body>
    <main>
      <div class="ax" aria-hidden="true">🫟</div>
      <div class="mono">// 404</div>
      <h1>você saiu do mapa.</h1>
      <p>Esse lugar não existe (ainda). O axolote confirmou.</p>
      <a href="/">VOLTAR AO INÍCIO</a>
    </main>
  </body>
</html>
